<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placement Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/custom.css') }}" rel="stylesheet">

  <!-- importmap: lets JS files use bare import names like 'vue', 'vue-router', 'axios' -->
  <script type="importmap">
  {
    "imports": {
      "vue": "https://unpkg.com/vue@3.5.38/dist/vue.esm-browser.js",
      "vue-router": "https://unpkg.com/vue-router@5.1.0/dist/vue-router.esm-browser.js",
      "@vue/devtools-api": "https://unpkg.com/@vue/devtools-api@8.1.3/dist/vue-devtools-api.esm-browser.js",
      "axios": "https://cdn.jsdelivr.net/npm/axios@1.6.8/dist/esm/axios.min.js"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Entry point — type="module" enables ES module imports across all files -->
  <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
